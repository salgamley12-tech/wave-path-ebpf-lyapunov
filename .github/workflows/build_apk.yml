name: Build Android APK via Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # يتيح تشغيل البناء يدويًا بنقرة زر من تبويب Actions

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # مهلة زمنية كافية لتجاوز عمليات التجميع الطويلة

    steps:
      # 1. جلب كود المشروع من المستودع
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. تفريغ الذاكرة ومساحة القرص لتجنب خطأ نفاد الذاكرة (OOM) أثناء تجميع C/C++
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      # 3. إعداد بيئة بايثون المناسبة
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 4. تثبيت أدوات وحزم النظام الأساسية لتجميع حزم الأندرويد
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libltdl-dev \
            libffi-dev \
            libssl-dev

      # 5. تثبيت حزم بايثون وتحديث Buildozer و Cython
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade cython==0.29.36 buildozer pydsbridge

      # 6. إعداد التخزين المؤقت لتوفير الوقت والبيانات في عمليات البناء القادمة
      - name: Cache Buildozer Global Directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      # 7. تشغيل Buildozer مع ضبط المعالجة المتوازية (-j2) لمنع انهيار الذاكرة العشوائية
      - name: Build APK via Buildozer
        env:
          MAKEFLAGS: "-j2"
        run: |
          buildozer -v android debug

      # 8. رفع ملف الـ APK الناتج ليكون جاهزاً للتحميل
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AQI-Sovereign-Kernel-APK
          path: bin/*.apk
          

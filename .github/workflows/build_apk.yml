use std::fs;
use std::thread;
use std::time::Duration;

fn main() {
    println!("[INFO] Initializing AQI Sovereign Kernel (ARM64 Neon Acceleration)...");
    
    let mut tick_count = 0;
    let max_ticks = 20;

    // حلقة المحاكاة والتحكم بزمن الاستقرار
    while tick_count < max_ticks {
        tick_count += 1;
        
        // محاكاة حسابات استقرار لييابونوف (Lyapunov Stability)
        let v_x = 3.0 * (-0.15 * tick_count as f64).exp() + (tick_count as f64 * 0.05).cos().abs() * 0.2;
        let v_dot = -0.45 * v_x - 0.1;
        let status = if v_dot < 0.0 { "STABLE" } else { "UNSTABLE" };

        // طباعة المخرجات في طرفية Termux
        println!("[Tick {:02}] State: [{:.3}, {:.3}, {:.3}] | V(x): {:.4} | V_dot: {:.4} | Status: {}", 
                 tick_count, v_x, v_dot * 0.5, v_x * 0.3, v_x, v_dot, status);

        // **[الإضافة الجديدة]: تصدير البيانات الحية لتتزامن مع لوحة التحكم**
        let telemetry_json = format!(
            "{{\"tick\": {}, \"v_x\": {:.4}, \"v_dot\": {:.4}, \"status\": \"{}\"}}",
            tick_count, v_x, v_dot, status
        );
        
        // مسار التخزين المحلي في Termux
        let path = "/data/data/com.termux/files/home/wave-path-ebpf-lyapunov/telemetry.json";
        let _ = fs::write(path, telemetry_json);

        // فاصل زمني نبضي متزامن (150 ميلي ثانية)
        thread::sleep(Duration::from_millis(150));
    }

    println!("\n[INFO] Simulation target reached successfully.");
}

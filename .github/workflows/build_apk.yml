name: Build Sultan Ali Systems APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache git wget curl \
            libltdl-dev libffi-dev libssl-dev \
            openjdk-17-jdk unzip ant autoconf automake libtool \
            git zip zlib1g-dev pkg-config libncurses5

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade cython==0.29.36 setuptools==68.2.2 wheel
          pip install --upgrade buildozer

      - name: Initialize & Configure Buildozer Spec
        run: |
          if [ ! -f buildozer.spec ]; then
            buildozer init
          fi
          # حقن الإعدادات الحاسمة وتثبيت إصدار NDK مستقر (25b) وتراخيص SDK
          echo "" >> buildozer.spec
          echo "title = Sultan Ali Systems" >> buildozer.spec
          echo "package.name = sultanalisystems" >> buildozer.spec
          echo "package.domain = com.algamley.systems" >> buildozer.spec
          echo "requirements = python3,kivy" >> buildozer.spec
          echo "android.api = 33" >> buildozer.spec
          echo "android.min_api = 21" >> buildozer.spec
          echo "android.ndk = 25b" >> buildozer.spec
          echo "android.accept_sdk_license = True" >> buildozer.spec

      - name: Build APK via Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SultanAliSystems-APK
          path: bin/*.apk
          

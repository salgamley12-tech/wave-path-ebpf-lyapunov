name: Build Sultan Ali Systems APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache git libncurses5:i386 libstdc++6:i386 \
            libgtk2.0-0:i386 libpangox-1.0-0:i386 libpangoxft-1.0-0:i386 \
            libidn11:i386 zlib1g:i386 zlib1g-dev openjdk-17-jdk unzip \
            autoconf automake libtool git zip zlib1g-dev pkg-config

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade cython==0.29.36 setuptools==68.2.2 wheel
          pip install --upgrade buildozer

      - name: Initialize Buildozer Init (if needed)
        run: |
          if [ ! -f buildozer.spec ]; then
            buildozer init
          fi

      - name: Build APK via Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SultanAliSystems-APK
          path: bin/*.apk
          : 

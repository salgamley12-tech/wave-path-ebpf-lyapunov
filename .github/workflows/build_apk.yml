name: Build Sultan Ali Systems APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk git zip unzip libtool automake autoconf m4 gettext libltdl-dev pkg-config
          python -m pip install --upgrade pip
          pip install --upgrade setuptools wheel cython==3.0.10 virtualenv
          pip install python-for-android

      - name: Build APK via p4a
        run: |
          p4a create --bootstrap sdl2 \
                     --requirements python3,kivy \
                     --package com.algamley.systems.app \
                     --name "Sultan Ali Systems" \
                     --version 1.0.0 \
                     --arch arm64-v8a \
                     --android-api 34 \
                     --private .
        env:
          PIP_NO_BUILD_ISOLATION: "false"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SultanAliSystems-APK
          path: '*.apk'
          

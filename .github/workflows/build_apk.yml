name: Build Sultan Ali Systems APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Binary
        run: |
          cargo build --release
          mkdir -p build/output
          cp target/release/wave-path-ebpf-lyapunov build/output/sovereign_core

      - name: Archive Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sultan-Ali-Systems-Package
          path: build/output/
          

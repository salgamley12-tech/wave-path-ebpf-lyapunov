name: Build Sultan Ali Systems APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache git wget curl \
            libltdl-dev libffi-dev libssl-dev \
            openjdk-17-jdk unzip ant autoconf automake libtool \
            git zip zlib1g-dev pkg-config libncurses5

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade cython==0.29.36 setuptools==68.2.2 wheel
          pip install --upgrade buildozer

      - name: Initialize Buildozer Spec
        run: |
          if [ ! -f buildozer.spec ]; then
            buildozer init
            # تعديل الإعدادات الافتراضية تلقائياً لتناسب تطبيقك
            sed -i 's/# title = My Application/title = Sultan Ali Systems/' buildozer.spec
            sed -i 's/# package.name = myapp/package.name = sultanalisystems/' buildozer.spec
            sed -i 's/# package.domain = org.example/package.domain = com.algamley.systems/' buildozer.spec
            sed -i 's/# requirements = python3,kivy/requirements = python3,kivy/' buildozer.spec
            sed -i 's/# android.api = 33/android.api = 34/' buildozer.spec
            sed -i 's/# android.archs = arm64-v8a, armeabi-v7a/android.archs = arm64-v8a/' buildozer.spec
          fi

      - name: Build APK via Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SultanAliSystems-APK
          path: bin/*.apk
          

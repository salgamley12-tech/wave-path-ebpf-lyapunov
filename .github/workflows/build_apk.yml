name: Build Sultan Ali Systems APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Core Binary
        run: |
          cargo build --release
          mkdir -p android_app/assets
          cp target/release/wave-path-ebpf-lyapunov android_app/assets/sovereign_core

      - name: Set up JDK for Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Simple Android Wrapper APK
        run: |
          # استخدام أدوات البناء السريعة لتوليد حاوية APK تضم النواة بداخلها
          mkdir -p build/apk_output
          echo "Sultan Ali Systems Sovereign v6.0" > build/apk_output/manifest.txt
          
          # تجميع هيكل تطبيق خفيف يثبت مباشرة
          cd android_app 2>/dev/null || mkdir -p android_app && cd android_app
          cat << 'EOF' > AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.sultan.systems.sovereign">
              <application android:label="Sultan Ali Systems v6.0" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          cd ..
          zip -r build/apk_output/Sultan-Ali-Systems-v6.0.apk android_app/ target/release/wave-path-ebpf-lyapunov

      - name: Upload Final APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sultan-Ali-Systems-Final-App
          path: build/apk_output/
          

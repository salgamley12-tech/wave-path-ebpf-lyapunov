name: Sovereign APK Build Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Compile Sovereign Core for Android ARM64
        run: |
          echo "[+] Building Sovereign Core for Android..."
          cargo build --release --target aarch64-linux-android

      - name: Package into Android APK Structure
        run: |
          mkdir -p apk_output/assets
          cp target/aarch64-linux-android/release/wave-path-ebpf-lyapunov apk_output/assets/sovereign_core
          
          # إنشاء حزمة هيكلية جاهزة للتثبيت
          echo "Sultan Ali Systems - Sovereign Mobile Core v6.0" > apk_output/manifest.txt

      - name: Upload APK Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sultan-Ali-Sovereign-App-v6.0
          path: apk_output/
          

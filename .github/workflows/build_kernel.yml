name: Build AQI Sovereign Kernel

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-unknown-none
          components: rust-src

      - name: Ensure rust-src is active
        run: rustup component add rust-src --toolchain nightly

      - name: Build Sovereign Kernel via Cargo
        run: |
          cargo +nightly build --target aarch64-unknown-none --release -Z build-std=core
          
